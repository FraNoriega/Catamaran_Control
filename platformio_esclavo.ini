; Copiar este contenido a platformio.ini de un proyecto PlatformIO nuevo
; para el ESP32 ESCLAVO (ESP32 DOIT DEVKIT V1, Arduino standalone).
[env:esp32doit-devkit-v1]
platform = espressif32@6.5.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
lib_deps =
    madhephaestus/ESP32Servo @ ^3.0.0
